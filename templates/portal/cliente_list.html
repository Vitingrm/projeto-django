{% extends "base.html" %}
{% block title %}Clientes{% endblock %}
{% block content %}
<div class="mt-4"><div class="row mb-4"><div class="col-md-8"><h1>👥 Clientes</h1></div><div class="col-md-4 text-right"><a href="{% url 'cliente-create' %}" class="btn btn-success">➕ Novo</a></div></div>
<table class="table"><thead class="table-dark"><tr><th>ID</th><th>Nome</th><th>CPF</th><th>Telefone</th><th class="text-center">Ações</th></tr></thead><tbody>{% for cliente in clientes %}<tr><td>{{ cliente.pk }}</td><td>{{ cliente.nome }}</td><td>{{ cliente.cpf }}</td><td>{{ cliente.telefone }}</td><td class="text-center"><a href="{% url 'cliente-update' cliente.pk %}" class="btn btn-sm btn-primary">✏️</a><a href="{% url 'cliente-delete' cliente.pk %}" class="btn btn-sm btn-danger">🗑️</a></td></tr>{% endfor %}</tbody></table>
</div>
{% endblock %}
