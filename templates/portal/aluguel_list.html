{% extends "base.html" %}
{% block title %}Aluguéis{% endblock %}
{% block content %}<div class="mt-4"><div class="row"><div class="col-md-8"><h1>📅 Aluguéis</h1></div><div class="col-md-4 text-right"><a href="{% url 'aluguel-create' %}" class="btn btn-success">➕ Novo</a></div></div><table class="table"><thead class="table-dark"><tr><th>ID</th><th>Veículo</th><th>Cliente</th><th>Data Retirada</th><th>Ações</th></tr></thead><tbody>{% for a in alugueis %}<tr><td>{{ a.pk }}</td><td>{{ a.veiculo.placa }}</td><td>{{ a.cliente.nome }}</td><td>{{ a.data_retirada|date:'d/m/Y' }}</td><td><a href="{% url 'aluguel-update' a.pk %}" class="btn btn-sm btn-primary">✏️</a></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
