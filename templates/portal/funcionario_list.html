{% extends "base.html" %}
{% block title %}Funcionários{% endblock %}
{% block content %}<div class="mt-4"><div class="row"><div class="col-md-8"><h1>👔 Funcionários</h1></div><div class="col-md-4 text-right"><a href="{% url 'funcionario-create' %}" class="btn btn-success">➕ Novo</a></div></div><table class="table"><thead class="table-dark"><tr><th>Nome</th><th>Cargo</th><th>Ações</th></tr></thead><tbody>{% for f in funcionarios %}<tr><td>{{ f.nome }}</td><td>{{ f.cargo }}</td><td><a href="{% url 'funcionario-update' f.pk %}" class="btn btn-sm btn-primary">✏️</a></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
