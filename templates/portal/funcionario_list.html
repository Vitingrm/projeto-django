{% extends "base.html" %}
{% block title %}Funcionários{% endblock %}
{% block content %}<div class="mt-4"><div class="row"><div class="col-md-8"><h1>👔 Funcionários</h1></div><div class="col-md-4 text-right"><a href="{% url 'funcionario-create' %}" class="btn btn-success">➕ Novo</a></div></div><div class="row mb-4"><div class="col-md-12"><form method="get"><input type="text" name="q" class="form-control" placeholder="Buscar funcionários (nome, cargo, email)..." value="{{ search_query }}" style="width: 100%; padding: 8px;"><button type="submit" class="btn btn-primary ml-2" style="margin-left: 10px;">Buscar</button>{% if search_query %}<a href="{% url 'funcionario-list' %}" class="btn btn-secondary ml-2" style="margin-left: 10px;">Limpar</a>{% endif %}</form></div></div><table class="table"><thead class="table-dark"><tr><th>Nome</th><th>Cargo</th><th>Ações</th></tr></thead><tbody>{% for f in funcionarios %}<tr><td>{{ f.nome }}</td><td>{{ f.cargo }}</td><td><a href="{% url 'funcionario-update' f.pk %}" class="btn btn-sm btn-primary">✏️</a><a href="{% url 'funcionario-delete' f.pk %}" class="btn btn-sm btn-danger">🗑️</a></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
