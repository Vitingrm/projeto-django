{% extends "base.html" %}
{% block title %}{{ categoria.nome }}{% endblock %}
{% block content %}
<div class="mt-4">
    <div class="row">
        <div class="col-md-8">
            <h1>{{ categoria.nome }}</h1>
            <p class="text-muted">{{ categoria.descricao }}</p>
            <a href="{% url 'categoria-update' categoria.pk %}" class="btn btn-primary">✏️ Editar</a>
            <a href="{% url 'categoria-list' %}" class="btn btn-secondary">⬅️ Voltar</a>
        </div>
    </div>
</div>
{% endblock %}
