{% extends "base.html" %}
{% block title %}Pagamentos{% endblock %}
{% block content %}<div class="mt-4"><div class="row"><div class="col-md-8"><h1>💰 Pagamentos</h1></div><div class="col-md-4 text-right"><a href="{% url 'pagamento-create' %}" class="btn btn-success">➕ Novo</a></div></div><table class="table"><thead class="table-dark"><tr><th>ID</th><th>Aluguel</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody>{% for p in pagamentos %}<tr><td>{{ p.pk }}</td><td>#{{ p.aluguel.pk }}</td><td>R$ {{ p.valor_pago }}</td><td><span class="badge badge-{% if p.status == 'pago' %}success{% else %}warning{% endif %}">{{ p.status }}</span></td><td><a href="{% url 'pagamento-update' p.pk %}" class="btn btn-sm btn-primary">✏️</a></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
